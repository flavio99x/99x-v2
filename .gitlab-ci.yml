stages:
  - build
  - secrets
  - deploy

# Release, namespace and Service name. Must start with a letter (k8s Service names),
# so not plain "99x-v2".
variables:
  RELEASE: website-99x-v2

# -------- TEMPLATES ----------
# .docker_build_template / .simple_helm_deploy_template: https://git.seeds.no/seeds/ci-templates/-/blob/master/general/helm.yml
# Chart: https://git.seeds.no/seeds/helm-charts/-/tree/main/charts/simple-container-app-chart

include:
  - project: "seeds/ci-templates"
    ref: master
    file: "/general/helm.yml"

# -------- JOBS ----------

main_build:
  extends: .docker_build_template
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/main:$CI_COMMIT_SHORT_SHA
    DOCKERFILE: Dockerfile
  only:
    - main

# Syncs the contact-form settings from GitLab CI/CD variables (Settings > CI/CD > Variables)
# into a k8s Secret the pod reads. Unset variables are skipped; without RESEND_API_KEY
# the form only logs submissions.
main_secrets:
  stage: secrets
  image:
    name: bitnamilegacy/kubectl:1.26.4
    entrypoint: [""]
  needs: []
  script:
    - kubectl create namespace $RELEASE --dry-run=client -o yaml | kubectl apply -f -
    - |
      ARGS=""
      for KEY in RESEND_API_KEY CONTACT_TO CONTACT_FROM; do
        VALUE=$(printenv $KEY || true)
        [ -n "$VALUE" ] && ARGS="$ARGS --from-literal=$KEY=$VALUE"
      done
      kubectl create secret generic $RELEASE-env --namespace $RELEASE $ARGS --dry-run=client -o yaml | kubectl apply -f -
  tags:
    - kubernetes
  only:
    - main

main_deploy:
  extends: .simple_helm_deploy_template
  needs:
    - main_build
    - main_secrets
  script:
    - |
      helm upgrade $RELEASE --namespace $RELEASE \
      --set image.repository=$CI_REGISTRY_IMAGE/main \
      --set image.tag=$CI_COMMIT_SHORT_SHA \
      --values=./environments/main.yaml \
      --install --create-namespace --wait chart-repo/simple-container-app
  environment:
    name: main
    url: https://website-99x-v2.k8s.seeds.no
  only:
    - main
